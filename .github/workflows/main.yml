name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Panther Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential uuid-dev iasl nasm gcc-aarch64-linux-gnu lz4 python3-pil python3-git gettext

      - name: Apply nested source patches
        run: |
          git -C GPLDrivers/Library/SimpleInit apply "$GITHUB_WORKSPACE/patches/simpleinit-panther.patch"

      - name: Build an image for panther
        run: |
          ./build.sh --device panther --toolchain GCC --outputdir "$PWD/out"

      - name: Repack boot image with magiskboot for real devices
        run: |
          # mkbootimg.py headers alone are not accepted by this device's ABL.
          # magiskboot repack preserves the exact vendor header layout
          # (AVB tags, page size) and recompresses the kernel with the same
          # format it detected (lz4_legacy for Pixel 7).
          set -e
          IMG="$GITHUB_WORKSPACE/out/boot-panther.img"
          [ -f "$IMG" ] || { echo "::error::boot image not found"; exit 1; }
          MAGISKBOOT="$GITHUB_WORKSPACE/tools/magiskboot/magiskboot"
          [ -x "$MAGISKBOOT" ] || { echo "::error::magiskboot not found"; exit 1; }
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          cd "$WORK"
          cp "$IMG" stock.img
          "$MAGISKBOOT" unpack -h stock.img
          # Reuse the extracted kernel (already lz4_legacy) and repack.
          # magiskboot reconstructs the v4 header from the detected template
          # fields, producing an image the real bootloader accepts.
          "$MAGISKBOOT" repack stock.img "$WORK/repacked.img"
          mv "$WORK/repacked.img" "$IMG"
          # Verify round-trip: unpack decompresses the kernel, so compare
          # against the DECOMPRESSED payload, not the lz4_legacy stream.
          "$MAGISKBOOT" unpack "$IMG" >/dev/null 2>&1
          lz4 -d -c \
            "$GITHUB_WORKSPACE/out/workspace/uefi-panther-kernel" \
            > payload.raw
          cmp kernel payload.raw \
            || { echo "::error::payload mismatch after repack"; exit 1; }
          echo "magiskboot repack complete: $(stat -c%s "$IMG") bytes"
          "$MAGISKBOOT" unpack -h "$IMG" 2>&1 | head -10

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panther
          path: out/boot-panther.img
          if-no-files-found: error
