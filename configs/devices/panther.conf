SOC_PLATFORM="TENSOR" #SOC name has to be all capital
VENDOR_NAME="Google"
PLATFORM_NAME="panther"

# mkbootimg config
# Stock panther boot.img has os_version 0 and os_patch_level 0 in its v4 header;
# match that so the image looks like a normal Google-signed layout to ABL.
BOOTIMG_OS_PATCH_LEVEL="2023-09"
BOOTIMG_OS_VERSION=13.0.0

# Stock boot.img has ramdisk_size 0 (Pixel 7 keeps its ramdisk in init_boot).
BOOTIMG_NO_RAMDISK=1

# Pixel 7 ABL only decompresses the legacy LZ4 container. Stock boot_a.img
# starts with 02 21 4c 18; a modern LZ4 frame (04 22 4d 18) makes
# "fastboot boot" bounce straight back to the bootloader.
BOOTIMG_LZ4_LEGACY=1

# ACPI config
SPLIT_DSDT=true
