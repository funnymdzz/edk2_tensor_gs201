FD_BASE=0x880000000
# ABL rejects payloads whose decompressed kernel exceeds 32MB
# (measured on panther: 33554432 = 32MB works, 33554488 fails).
# BootShim prepends 144 bytes, so the FD itself must stay well under 32MB.
# The actual firmware content is ~3.6MB; 8MB leaves room to grow.
FD_SIZE=0x00800000
